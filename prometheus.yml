global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'minio-bucket'
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'backup-exporter'
    static_configs:
      - targets: ['backup-exporter:8001']

  - job_name: 'patroni'
    static_configs:
      - targets: ['patroni-exporter:8002']
