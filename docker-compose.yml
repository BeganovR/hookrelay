services:

  etcd1:
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /etcd-data
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCDCTL_API: "3"
    volumes:
      - etcd1_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - default

  etcd2:
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd2
      ETCD_DATA_DIR: /etcd-data
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCDCTL_API: "3"
    volumes:
      - etcd2_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - default

  etcd3:
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd3
      ETCD_DATA_DIR: /etcd-data
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCDCTL_API: "3"
    volumes:
      - etcd3_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - default

  patroni1:
    build:
      context: .
      dockerfile: Dockerfile.patroni
    env_file:
      - .env
    environment:
      PATRONI_NAME: patroni1
      PATRONI_HOST: patroni1
    volumes:
      - patroni1_data:/var/lib/postgresql/data
    ports:
      - "8008:8008"
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default

  patroni2:
    build:
      context: .
      dockerfile: Dockerfile.patroni
    env_file:
      - .env
    environment:
      PATRONI_NAME: patroni2
      PATRONI_HOST: patroni2
    volumes:
      - patroni2_data:/var/lib/postgresql/data
    ports:
      - "8009:8008"
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default

  haproxy:
    image: haproxy:2.8-alpine
    restart: on-failure:5
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5000"
      - "5433:5001"
      - "7000:7000"
    depends_on:
      patroni1:
        condition: service_healthy
      patroni2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  patroni-exporter:
    build:
      context: .
      dockerfile: Dockerfile.patroni_exporter
    ports:
      - "8002:8002"
    depends_on:
      patroni1:
        condition: service_healthy
      patroni2:
        condition: service_healthy
    networks:
      - default

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    env_file:
      - .env
    environment:
      DATA_SOURCE_NAME: "postgresql://metrics_user:${METRICS_USER_PASSWORD}@haproxy:5000/hookrelay?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - default

  minio:
    image: minio/minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - default

  minio-init:
    image: minio/mc
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/tmp/minio_init.sh"]
    volumes:
      - ./backup/minio_init.sh:/tmp/minio_init.sh
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - default

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    env_file:
      - .env
    environment:
      POSTGRES_HOST: haproxy
      POSTGRES_PORT: 5000
    depends_on:
      haproxy:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - default

  backup-exporter:
    build:
      context: .
      dockerfile: Dockerfile.backup
    entrypoint: ["python3", "/usr/local/bin/exporter.py"]
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - postgres_exporter
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - default

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: haproxy
      POSTGRES_PORT: 5000
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB}
      MIGRATION_VERSION: ${MIGRATION_VERSION}
    depends_on:
      haproxy:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - default

  kafka-connect:
    image: quay.io/debezium/connect:2.7
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    depends_on:
      kafka:
        condition: service_healthy
      haproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - default

  kafka-connect-init:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "/etc/debezium/register.sh"]
    environment:
      CONNECT_URL: http://kafka-connect:8083
    volumes:
      - ./bi/debezium:/etc/debezium:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - default

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      - kafka
    networks:
      - default

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
    volumes:
      - ./bi/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./bi/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - default

  metabase-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase_password}
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase_password}
      MB_DB_HOST: metabase-db
      JAVA_TIMEZONE: UTC
    depends_on:
      metabase-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 120s
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@haproxy:5000/${POSTGRES_DB}?sslmode=disable
      PORT: ${PORT:-8080}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      INGEST_RATE_PER_SEC: ${INGEST_RATE_PER_SEC:-20}
      INGEST_RATE_BURST: ${INGEST_RATE_BURST:-40}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
      WORKER_STUCK_TIMEOUT: ${WORKER_STUCK_TIMEOUT:-5m}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      haproxy:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  patroni1_data:
  patroni2_data:
  prometheus_data:
  grafana_data:
  minio_data:
  kafka_data:
  clickhouse_data:
  metabase_db_data:
